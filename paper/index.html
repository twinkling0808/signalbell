<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Bell</title>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="theme-color" content="#14284B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: single-column broadsheet archive; list of edition cards, each opens its full front page. Newspaper is one committed light world. */
:root{
  --paper:#f7f6f2;
  --ink:#1b1b1f;
  --muted:#6a6a72;
  --rule:#d9d6cc;
  --navy:#14213d;
  --gold:#b8892b;
  --burg:#5a1224;
  --bronze:#a8742f;
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --display:"Playfair Display",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);line-height:1.8;font-size:17px}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
.arch-head{text-align:center;border-bottom:3px double var(--ink);padding-bottom:18px;margin-bottom:26px}
.arch-head h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,72px);letter-spacing:.04em;margin:0;line-height:1.1;text-wrap:balance}
.arch-head p{font-family:var(--sans);font-size:13px;letter-spacing:.14em;color:var(--muted);margin:8px 0 0;text-transform:uppercase}
#empty{font-family:var(--sans);color:var(--muted);text-align:center;padding:48px 12px;border:1px dashed var(--rule)}
.cards{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;text-decoration:none;padding:16px 18px;border:1px solid var(--rule);border-left:6px solid var(--navy);background:#fff}
.card.pm{border-left-color:var(--burg)}
.card:hover,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card .k{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--navy)}
.card.pm .k{color:var(--burg)}
.card .d{font-family:var(--sans);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;justify-self:end}
.card .h{grid-column:1/-1;font-weight:700;font-size:18px;line-height:1.45;text-wrap:balance}

/* ---- edition (full newspaper page) ---- */
.edition{display:none}
body.reading .edition.open{display:block}
body.reading .list{display:none}
.back{position:sticky;top:0;z-index:5;display:block;font-family:var(--sans);font-size:14px;font-weight:500;padding:11px 4px;margin:0 0 12px;text-decoration:none;background:var(--paper);border-bottom:1px solid var(--rule)}
.filters{display:flex;gap:8px;margin:0 0 16px;font-family:var(--sans)}
.filters button{font:inherit;font-size:14px;padding:7px 16px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dg{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-top:10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.dg:first-child{margin-top:0}
.pager{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:15px;padding:22px 4px 0}
.pager a{padding:10px 16px;border:1px solid var(--rule);background:#fff;text-decoration:none}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 4px;font-family:var(--sans)}
.nums div{background:#fff;border:1px solid var(--rule);border-top:3px solid var(--b);padding:10px 12px;font-size:13px;color:var(--muted)}
.nums b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.box{margin:18px 0;padding:12px 16px;background:#fff;border:1px solid var(--rule);border-left:5px solid var(--a)}
.box h3{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--a);margin:0 0 6px}
.box ul{margin:0;padding-left:18px}
.box li{margin:3px 0}
.sec ul.deal{margin:4px 0 8px;padding-left:18px}
.sec ul.deal li{margin:6px 0}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 8px;margin-right:6px;color:#fff;background:var(--a);vertical-align:1px}
.paper{--a:var(--navy);--b:var(--gold)}
.paper.pm{--a:var(--burg);--b:var(--bronze)}
.mast{background:var(--a);color:#fff;text-align:center;padding:22px 14px 16px;border-bottom:5px solid var(--b)}
.mast .t{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,64px);letter-spacing:.06em;line-height:1.1}
.mast .ed{font-family:var(--display);font-size:16px;letter-spacing:.3em;color:var(--b);text-transform:uppercase;margin-top:6px;filter:brightness(1.35)}
.mast .dt{font-family:var(--sans);font-size:13px;margin-top:8px;opacity:.85;font-variant-numeric:tabular-nums}
.lead{padding:26px 4px 18px;border-bottom:1px solid var(--rule)}
.lead h2{font-size:clamp(26px,5.5vw,38px);line-height:1.3;margin:0 0 10px;font-weight:700;text-wrap:balance}
.lead p{margin:0}
.weather{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--sans);font-size:14px;padding:12px 14px;margin:18px 0;background:#fff;border:1px solid var(--rule);border-top:3px solid var(--b)}
.weather b{color:var(--a)}
.sec{padding:18px 4px;border-bottom:1px solid var(--rule)}
.sec h3{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--a);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--b)}
.sec h4{font-size:17px;margin:12px 0 2px;line-height:1.45}
.sec p{margin:2px 0 8px}
.sec .src{font-family:var(--sans);font-size:12px;color:var(--muted)}
table.mkt{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;margin:6px 0}
table.mkt th,table.mkt td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right}
table.mkt th:first-child,table.mkt td:first-child{text-align:left}
table.mkt th{background:var(--a);color:#fff;font-weight:500}
.up{color:#b3261e}.down{color:#1a55b0}
.tbl-scroll{overflow-x:auto}
.note{font-family:var(--sans);font-size:13px;color:var(--muted);background:#fff;border-left:3px solid var(--b);padding:8px 12px;margin:8px 0}
.foot{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:center;padding-top:18px}
@media (max-width:480px){.card{grid-template-columns:1fr}.card .d{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-1px)}}

b.key{font-weight:700;color:#A6191B;background:#FFEFA8;padding:0 3px;border-radius:2px}
.tag.hot{background:#D3261E}
.paper .box,.paper .weather,.paper .sec{scroll-margin-top:100px}
.jump{position:sticky;top:43px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:var(--paper);border-bottom:1px solid var(--rule);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;font-family:var(--sans);font-size:13px;font-weight:500;padding:5px 12px;border:1px solid var(--a);border-radius:16px;background:#fff;color:var(--a);cursor:pointer}
.jump button:active{background:var(--a);color:#fff}
#totop{position:fixed;right:14px;bottom:20px;z-index:9;width:44px;height:44px;border-radius:50%;border:0;background:#14284B;color:#fff;font-size:20px;line-height:1;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
#totop.on{display:block}
.weather.wxs{display:block;padding:0;border:0;background:none}
.wxrow{display:flex;gap:8px}
.wx{flex:1 1 0;display:block;padding:10px 12px;background:#fff;border:1px solid var(--rule);font-family:var(--sans)}
.wx.main{border:2px solid var(--a);background:#FFF9E6}
.wx.ic{display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center}
.wx.ic svg{grid-row:1/4;width:44px;height:44px}
.wx .wl{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--a)}
.wx .wt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.wx .wd{font-size:13px;color:var(--muted)}
.wtip{list-style:none;margin:8px 0 0;padding:10px 14px;background:#fff;border-left:5px solid #D3261E;font-family:var(--sans);font-size:14px}
.wtip li{margin:3px 0}
.wtip li::before{content:"\2713\00a0";color:#D3261E;font-weight:700}
@media(max-width:420px){.wxrow{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="list" id="listView">
    <header class="arch-head">
      <h1>THE SIGNAL BELL</h1>
      <p>Morning 08:00 · Evening 18:00 · Archive</p>
    </header>
    <div id="empty">첫 호는 2026-11-25 조간(오전 8시)에 발행됩니다.</div>
    <div class="filters" id="filters" style="display:none">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="am" aria-pressed="false">조간</button>
      <button type="button" data-f="pm" aria-pressed="false">석간</button>
    </div>
    <div class="cards" id="cards">
<!--CARDS-->
</div>
  </div>
<!--EDITIONS-->
</div>
<button id="totop" type="button" aria-label="맨 위로">↑</button>
<script>
(function(){
  function route(){
    var id=(location.hash||'').replace('#','');
    var eds=document.querySelectorAll('.edition');
    var found=false;
    eds.forEach(function(e){
      var on=(e.id===id);
      e.classList.toggle('open',on);
      if(on)found=true;
    });
    document.body.classList.toggle('reading',found);
    if(found)window.scrollTo(0,0);
  }
  var cardsEl=document.getElementById('cards');
  var cards=[].slice.call(cardsEl.querySelectorAll('.card'));
  var em=document.getElementById('empty');
  var fl=document.getElementById('filters');
  if(cards.length>0){em.style.display='none';fl.style.display='flex';}
  var ids=cards.map(function(c){return c.getAttribute('href').slice(1);});
  ids.forEach(function(id,i){
    var ed=document.getElementById(id);
    if(!ed)return;
    var older=ids[i+1],newer=ids[i-1];
    var nav=document.createElement('nav');
    nav.className='pager';
    nav.innerHTML=(older?'<a href="#'+older+'">← 이전 호</a>':'<span></span>')+(newer?'<a href="#'+newer+'">다음 호 →</a>':'<span></span>');
    ed.appendChild(nav);
  });

  var ICONS={
    sun:'<circle cx="22" cy="22" r="8" fill="#F2A900"/><g stroke="#F2A900" stroke-width="3" stroke-linecap="round"><path d="M22 4v5M22 35v5M4 22h5M35 22h5M9 9l3.5 3.5M31.5 31.5L35 35M35 9l-3.5 3.5M12.5 31.5L9 35"/></g>',
    cloud:'<path d="M12 33a8 8 0 0 1 1-16 10 10 0 0 1 19 3 6.5 6.5 0 0 1-1 13z" fill="#8A97A8"/>',
    partly:'<circle cx="16" cy="15" r="6" fill="#F2A900"/><g stroke="#F2A900" stroke-width="2.5" stroke-linecap="round"><path d="M16 3v3M4 15h3M7.5 6.5L9.5 8.5M24.5 6.5L22.5 8.5"/></g><path d="M14 36a7 7 0 0 1 1-14 9 9 0 0 1 17 3 6 6 0 0 1-1 11z" fill="#8A97A8"/>',
    rain:'<path d="M12 27a7 7 0 0 1 1-14 9 9 0 0 1 17 3 6 6 0 0 1-1 11z" fill="#8A97A8"/><g stroke="#2F7DD1" stroke-width="3" stroke-linecap="round"><path d="M14 33l-2 6M23 33l-2 6M32 33l-2 6"/></g>',
    snow:'<path d="M12 27a7 7 0 0 1 1-14 9 9 0 0 1 17 3 6 6 0 0 1-1 11z" fill="#8A97A8"/><g fill="#6FB1E6"><circle cx="14" cy="35" r="2.5"/><circle cx="23" cy="38" r="2.5"/><circle cx="32" cy="35" r="2.5"/></g>',
    dust:'<g stroke="#B08968" stroke-width="3" stroke-linecap="round"><path d="M6 14h22M12 22h26M6 30h22M14 38h20"/></g>'
  };
  [].forEach.call(document.querySelectorAll('.wx[data-wx]'),function(w){
    var s=ICONS[w.getAttribute('data-wx')];
    if(!s)return;
    w.classList.add('ic');w.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 44 44" aria-hidden="true">'+s+'</svg>');
  });
  var LAB=[[/Politic/,'정치'],[/Econom/,'경제'],[/Society/,'사회'],[/Culture/,'문화'],[/Technolog/,'기술'],[/Leisure/,'레저'],[/Capital/,'증시'],[/AI/,'AI'],[/Higher/,'고등교육'],[/Deals/,'할인·티켓']];
  [].forEach.call(document.querySelectorAll('.edition'),function(ed){
    var paper=ed.querySelector('.paper'),mast=ed.querySelector('.mast');
    if(!paper||!mast)return;
    var items=[],box=paper.querySelector('.box'),wx=paper.querySelector('.weather');
    if(box)items.push(['브리핑',box]);
    if(wx)items.push(['날씨',wx]);
    [].forEach.call(paper.querySelectorAll('.sec'),function(s){
      var h=s.querySelector('h3'),t=h?h.textContent:'',l=t.split(' ')[0];
      LAB.some(function(p){if(p[0].test(t)){l=p[1];return true;}});
      items.push([l,s]);
    });
    var nav=document.createElement('div');
    nav.className='jump';
    items.forEach(function(it){
      var b=document.createElement('button');
      b.type='button';b.textContent=it[0];
      b.addEventListener('click',function(){it[1].scrollIntoView({behavior:'smooth',block:'start'});});
      nav.appendChild(b);
    });
    mast.insertAdjacentElement('afterend',nav);
  });
  var tt=document.getElementById('totop');
  window.addEventListener('scroll',function(){tt.classList.toggle('on',document.body.classList.contains('reading')&&window.scrollY>500);},{passive:true});
  tt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  var filter='all';
  function render(){
    [].forEach.call(cardsEl.querySelectorAll('.dg'),function(n){n.remove();});
    var last='';
    cards.forEach(function(c){
      var show=filter==='all'||c.classList.contains(filter);
      c.style.display=show?'':'none';
      if(!show)return;
      var k=c.getAttribute('href').slice(4,12);
      if(k===last)return;
      last=k;
      var d=new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8));
      var h=document.createElement('div');
      h.className='dg';
      h.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'.charAt(d.getDay())+')';
      cardsEl.insertBefore(h,c);
    });
  }
  [].forEach.call(fl.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){
      filter=b.getAttribute('data-f');
      [].forEach.call(fl.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      render();
    });
  });
  render();
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
